name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vps-manager

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: vps-manager/frontend

      - name: Build frontend
        run: npm run build
        working-directory: vps-manager/frontend

      - name: Build
        run: go build -tags "production" -ldflags="-w -s -H windowsgui" -o vps-manager-windows-amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-manager-windows-amd64
          path: vps-manager/vps-manager-windows-amd64.exe

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vps-manager

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm install
        working-directory: vps-manager/frontend

      - name: Build frontend
        run: npm run build
        working-directory: vps-manager/frontend

      - name: Build
        run: CGO_ENABLED=1 go build -tags "production,webkit2_41" -ldflags="-w -s" -o vps-manager-linux-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-manager-linux-amd64
          path: vps-manager/vps-manager-linux-amd64
